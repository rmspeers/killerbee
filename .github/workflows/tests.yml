name: Tests

# Manual only for now: run from the Actions tab ("Run workflow"). Add push/pull_request triggers later.
on:
  workflow_dispatch:
    inputs:
      python-versions:
        description: "JSON list of Python versions to test"
        required: false
        default: '["3.9", "3.11", "3.13"]'
      min-coverage:
        description: "Minimum package coverage percentage"
        required: false
        default: "90"

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgcrypt20-dev libusb-1.0-0
      - name: Build zigbee_crypt and install KillerBee
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py build_ext --inplace
          python -m pip install --no-build-isolation -e '.[test]'
      - name: Run tests (hardware is mocked)
        run: python -m pytest tests -v --cov=killerbee --cov-report=term-missing --cov-fail-under=${{ inputs.min-coverage }}
